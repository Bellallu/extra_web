<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" width="280" height="100">
  <defs>
    <radialGradient id="logo-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Wheat stalk icon -->
  <!-- Center stem -->
  <line x1="30" y1="88" x2="30" y2="18" stroke="#92400E" stroke-width="2" stroke-linecap="round"/>
  <!-- Wheat grains left -->
  <ellipse cx="22" cy="28" rx="7" ry="4" fill="#D97706" transform="rotate(-30 22 28)"/>
  <ellipse cx="20" cy="40" rx="7" ry="4" fill="#B45309" transform="rotate(-25 20 40)"/>
  <ellipse cx="19" cy="52" rx="7" ry="4" fill="#92400E" transform="rotate(-20 19 52)"/>
  <ellipse cx="20" cy="64" rx="6" ry="3.5" fill="#78350F" transform="rotate(-15 20 64)"/>
  <!-- Wheat grains right -->
  <ellipse cx="38" cy="32" rx="7" ry="4" fill="#D97706" transform="rotate(30 38 32)"/>
  <ellipse cx="40" cy="44" rx="7" ry="4" fill="#B45309" transform="rotate(25 40 44)"/>
  <ellipse cx="41" cy="56" rx="7" ry="4" fill="#92400E" transform="rotate(20 41 56)"/>
  <ellipse cx="40" cy="68" rx="6" ry="3.5" fill="#78350F" transform="rotate(15 40 68)"/>
  <!-- Wheat tip -->
  <ellipse cx="30" cy="18" rx="4" ry="7" fill="#FDE68A"/>

  <!-- Brand name -->
  <!-- "Crust" -->
  <text x="58" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#78350F" letter-spacing="2">Crust</text>
  <!-- Ampersand -->
  <text x="147" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#D97706" letter-spacing="0">&amp;</text>
  <!-- "Crumb" -->
  <text x="168" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#78350F" letter-spacing="2">Crumb</text>

  <!-- Tagline -->
  <text x="58" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="400" fill="#B45309" letter-spacing="3.5">BAKED BEFORE SUNRISE</text>

  <!-- Decorative line under tagline -->
  <line x1="58" y1="74" x2="245" y2="74" stroke="#FDE68A" stroke-width="1.2" stroke-opacity="0.7"/>
</svg>
