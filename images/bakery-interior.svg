<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <filter id="grain6">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="multiply"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="wood-shelf">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.6" numOctaves="3" seed="7" result="wn"/>
      <feDisplacementMap in="SourceGraphic" in2="wn" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <radialGradient id="window-light" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FEF3C7" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="bg-interior" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="55%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="shelf-wood" x1="0%" y1="0%" x2="100%" y2="8%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="40%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <radialGradient id="bread-warm" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </radialGradient>
    <radialGradient id="ambient-warm" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFDE7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background wall -->
  <rect width="800" height="450" fill="url(#wall-grad)"/>
  <rect width="800" height="450" fill="#FEF3C7" opacity="0.12" filter="url(#grain6)"/>

  <!-- Floor -->
  <rect x="0" y="340" width="800" height="110" fill="url(#floor-grad)"/>
  <!-- Floor boards -->
  <line x1="0" y1="355" x2="800" y2="358" stroke="#451A03" stroke-width="1.5" stroke-opacity="0.2"/>
  <line x1="0" y1="378" x2="800" y2="381" stroke="#451A03" stroke-width="1.2" stroke-opacity="0.15"/>
  <line x1="0" y1="400" x2="800" y2="403" stroke="#451A03" stroke-width="1" stroke-opacity="0.12"/>
  <line x1="0" y1="422" x2="800" y2="425" stroke="#451A03" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Back wall shelf unit — atmospheric blur (background layer) -->
  <g filter="url(#blur-bg)" opacity="0.75">
    <!-- Far shelf frame -->
    <rect x="40" y="60" width="720" height="280" rx="4" fill="#92400E" opacity="0.2"/>
    <!-- Shelf boards (background, blurred) -->
    <rect x="50" y="115" width="700" height="14" rx="3" fill="url(#shelf-wood)" filter="url(#wood-shelf)"/>
    <rect x="50" y="205" width="700" height="14" rx="3" fill="url(#shelf-wood)" filter="url(#wood-shelf)"/>
    <rect x="50" y="295" width="700" height="14" rx="3" fill="url(#shelf-wood)" filter="url(#wood-shelf)"/>
    <!-- Far background bread loaves (blurred, desaturated) -->
    <ellipse cx="130" cy="100" rx="45" ry="22" fill="#C8860A" opacity="0.5"/>
    <ellipse cx="235" cy="98" rx="42" ry="20" fill="#B45309" opacity="0.45"/>
    <ellipse cx="500" cy="97" rx="50" ry="24" fill="#D97706" opacity="0.45"/>
    <ellipse cx="630" cy="100" rx="44" ry="21" fill="#92400E" opacity="0.45"/>
    <ellipse cx="130" cy="190" rx="43" ry="21" fill="#B45309" opacity="0.4"/>
    <ellipse cx="260" cy="188" rx="47" ry="22" fill="#C8860A" opacity="0.4"/>
    <ellipse cx="490" cy="191" rx="45" ry="21" fill="#D97706" opacity="0.4"/>
  </g>

  <!-- Foreground counter/display -->
  <rect x="0" y="305" width="800" height="45" rx="0" fill="#92400E"/>
  <rect x="0" y="305" width="800" height="6" fill="#D97706" opacity="0.5"/>
  <!-- Counter front panel -->
  <rect x="0" y="310" width="800" height="40" fill="#78350F"/>
  <rect x="0" y="310" width="800" height="40" fill="#451A03" opacity="0.3" filter="url(#wood-shelf)"/>

  <!-- Featured bread on counter (foreground, sharp) -->
  <!-- Bread loaf 1 -->
  <g class="breathe">
    <ellipse cx="190" cy="296" rx="62" ry="26" fill="#78350F" opacity="0.3"/>
    <ellipse cx="190" cy="286" rx="58" ry="24" fill="#92400E"/>
    <ellipse cx="190" cy="278" rx="55" ry="22" fill="url(#bread-warm)"/>
    <path d="M 148 272 Q 190 258 232 272" stroke="#78350F" stroke-width="2.5" fill="none" stroke-opacity="0.6"/>
    <path d="M 155 282 Q 190 268 225 282" stroke="#78350F" stroke-width="2" fill="none" stroke-opacity="0.4"/>
    <ellipse cx="178" cy="268" rx="26" ry="10" fill="#FFFBEB" opacity="0.22"/>
  </g>

  <!-- Bread loaf 2 -->
  <g class="breathe">
    <ellipse cx="400" cy="294" rx="70" ry="28" fill="#78350F" opacity="0.3"/>
    <ellipse cx="400" cy="282" rx="65" ry="25" fill="#92400E"/>
    <ellipse cx="400" cy="272" rx="62" ry="23" fill="url(#bread-warm)"/>
    <path d="M 352 266 Q 400 250 448 266" stroke="#78350F" stroke-width="2.5" fill="none" stroke-opacity="0.6"/>
    <path d="M 360 278 Q 400 262 440 278" stroke="#78350F" stroke-width="2" fill="none" stroke-opacity="0.4"/>
    <ellipse cx="386" cy="262" rx="28" ry="10" fill="#FFFBEB" opacity="0.22"/>
  </g>

  <!-- Bread loaf 3 -->
  <g class="breathe">
    <ellipse cx="610" cy="297" rx="58" ry="24" fill="#78350F" opacity="0.3"/>
    <ellipse cx="610" cy="286" rx="55" ry="22" fill="#92400E"/>
    <ellipse cx="610" cy="278" rx="52" ry="20" fill="url(#bread-warm)"/>
    <path d="M 570 272 Q 610 258 650 272" stroke="#78350F" stroke-width="2.5" fill="none" stroke-opacity="0.6"/>
    <ellipse cx="598" cy="268" rx="22" ry="8" fill="#FFFBEB" opacity="0.22"/>
  </g>

  <!-- Window light overlay from above -->
  <rect width="800" height="450" fill="url(#window-light)"/>
  <!-- Ambient warm glow -->
  <rect width="800" height="450" fill="url(#ambient-warm)"/>
</svg>
