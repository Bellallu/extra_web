<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #FEF3C7;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .container {
    width: 1200px;
    height: 630px;
    display: flex;
    background: linear-gradient(135deg, #FFF8E7 0%, #FEF3C7 50%, #FDE68A 100%);
    position: relative;
  }
  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px 60px;
    z-index: 2;
  }
  .logo-mark {
    width: 64px;
    height: 64px;
    margin-bottom: 28px;
  }
  .tagline {
    font-size: 13px;
    letter-spacing: 4px;
    color: #B45309;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  h1 {
    font-size: 72px;
    font-weight: 700;
    color: #78350F;
    line-height: 1.1;
    margin-bottom: 24px;
    letter-spacing: -1px;
  }
  h1 span { color: #D97706; }
  .description {
    font-size: 22px;
    color: #92400E;
    line-height: 1.55;
    max-width: 460px;
  }
  .divider {
    width: 80px;
    height: 3px;
    background: #D97706;
    border-radius: 2px;
    margin: 28px 0;
  }
  .right {
    width: 480px;
    position: relative;
    overflow: hidden;
  }
  .bread-visual {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .warm-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #FEF3C7 0%, transparent 40%);
    z-index: 1;
  }
  .badge {
    position: absolute;
    bottom: 50px;
    left: 50px;
    background: #78350F;
    color: #FEF3C7;
    padding: 10px 24px;
    border-radius: 999px;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 3;
  }
  .corner-grain {
    position: absolute;
    top: 0; right: 0;
    width: 200px; height: 200px;
    background: radial-gradient(circle at 100% 0%, #FDE68A 0%, transparent 70%);
    opacity: 0.5;
    z-index: 0;
  }
</style>
</head>
<body>
<div class="container">
  <div class="corner-grain"></div>
  <div class="left">
    <!-- Wheat icon inline SVG -->
    <svg class="logo-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <line x1="32" y1="60" x2="32" y2="12" stroke="#92400E" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="22" cy="22" rx="9" ry="5" fill="#D97706" transform="rotate(-30 22 22)"/>
      <ellipse cx="20" cy="34" rx="9" ry="5" fill="#B45309" transform="rotate(-25 20 34)"/>
      <ellipse cx="20" cy="46" rx="8" ry="4.5" fill="#92400E" transform="rotate(-18 20 46)"/>
      <ellipse cx="42" cy="26" rx="9" ry="5" fill="#D97706" transform="rotate(30 42 26)"/>
      <ellipse cx="44" cy="38" rx="9" ry="5" fill="#B45309" transform="rotate(25 44 38)"/>
      <ellipse cx="44" cy="50" rx="8" ry="4.5" fill="#92400E" transform="rotate(18 44 50)"/>
      <ellipse cx="32" cy="13" rx="5" ry="9" fill="#FDE68A"/>
    </svg>
    <p class="tagline">Crust &amp; Crumb Bakery</p>
    <h1>Baked<br>Before<br><span>Sunrise.</span></h1>
    <div class="divider"></div>
    <p class="description">Handmade sourdough, golden croissants, and Saturday bread — made with real flour, real time, and no shortcuts.</p>
  </div>
  <div class="right">
    <!-- Inline bread visual as SVG -->
    <div class="bread-visual">
      <svg viewBox="0 0 480 630" width="480" height="630" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="og-bg" cx="50%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#FFF8E7"/>
            <stop offset="100%" stop-color="#FDE68A"/>
          </radialGradient>
          <radialGradient id="og-bread" cx="40%" cy="35%" r="55%">
            <stop offset="0%" stop-color="#FDE68A"/>
            <stop offset="45%" stop-color="#D97706"/>
            <stop offset="100%" stop-color="#92400E"/>
          </radialGradient>
          <filter id="og-tex">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="3"/>
            <feDisplacementMap in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <radialGradient id="og-wood" cx="45%" cy="35%" r="60%">
            <stop offset="0%" stop-color="#B45309"/>
            <stop offset="100%" stop-color="#78350F"/>
          </radialGradient>
        </defs>
        <rect width="480" height="630" fill="url(#og-bg)"/>
        <!-- Board -->
        <rect x="40" y="360" width="400" height="200" rx="12" fill="url(#og-wood)"/>
        <!-- Board highlight -->
        <rect x="40" y="360" width="400" height="6" rx="3" fill="#D97706" opacity="0.3"/>
        <!-- Flour -->
        <ellipse cx="240" cy="440" rx="150" ry="35" fill="#FFFDF7" opacity="0.3"/>
        <!-- Bread shadow -->
        <ellipse cx="240" cy="372" rx="150" ry="30" fill="#451A03" opacity="0.2"/>
        <!-- Bread loaf -->
        <ellipse cx="240" cy="340" rx="145" ry="65" fill="#78350F" filter="url(#og-tex)"/>
        <ellipse cx="240" cy="330" rx="138" ry="60" fill="url(#og-bread)" filter="url(#og-tex)"/>
        <!-- Score lines -->
        <path d="M 150 318 Q 240 290 330 318" stroke="#78350F" stroke-width="3.5" fill="none" stroke-opacity="0.65"/>
        <path d="M 162 338 Q 240 310 318 338" stroke="#78350F" stroke-width="2.8" fill="none" stroke-opacity="0.5"/>
        <!-- Highlight -->
        <ellipse cx="220" cy="308" rx="65" ry="28" fill="#FEF3C7" opacity="0.22"/>
        <!-- Flour specks -->
        <circle cx="130" cy="385" r="8" fill="#FFFDF7" opacity="0.4"/>
        <circle cx="340" cy="400" r="6" fill="#FFFDF7" opacity="0.35"/>
        <circle cx="200" cy="420" r="5" fill="#FFFDF7" opacity="0.3"/>
      </svg>
    </div>
    <div class="warm-overlay"></div>
  </div>
  <div class="badge">Visit us this Saturday</div>
</div>
</body>
</html>
