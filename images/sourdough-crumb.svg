<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <filter id="grain7">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="multiply"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="crumb-tex">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="6" seed="15" result="crumbNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="crumbNoise" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="crust-tex">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="4" result="crustNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="crustNoise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="bg7" cx="50%" cy="45%" r="68%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="60%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="crumb-inner" cx="45%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="45%" stop-color="#FDE68A"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <radialGradient id="crust-outer" cx="40%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="40%" stop-color="#B45309"/>
      <stop offset="75%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>
    <radialGradient id="dramatic-light" cx="25%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow7" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#451A03" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#451A03" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background — dark dramatic -->
  <rect width="600" height="450" fill="#2C1A0E"/>
  <rect width="600" height="450" fill="#451A03" opacity="0.4" filter="url(#grain7)"/>

  <!-- Background warm tone -->
  <radialGradient id="bg-dark7" cx="50%" cy="45%" r="65%" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#3B1F0E"/>
    <stop offset="100%" stop-color="#1A0E05"/>
  </radialGradient>
  <rect width="600" height="450" fill="url(#bg-dark7)"/>

  <!-- Shadow under bread -->
  <ellipse cx="300" cy="410" rx="180" ry="20" fill="url(#shadow7)"/>

  <!-- CROSS SECTION — outer crust ring (deep) -->
  <ellipse cx="300" cy="222" rx="188" ry="175" fill="#451A03" filter="url(#crust-tex)"/>

  <!-- CRUST LAYER — outer dark crust -->
  <ellipse cx="300" cy="218" rx="182" ry="168" fill="#78350F" filter="url(#crust-tex)"/>
  <ellipse cx="300" cy="214" rx="176" ry="162" fill="url(#crust-outer)" filter="url(#crust-tex)"/>

  <!-- CRUMB INTERIOR — the open texture -->
  <ellipse cx="300" cy="210" rx="155" ry="142" fill="url(#crumb-inner)" filter="url(#crumb-tex)"/>

  <!-- Open crumb holes — large irregular bubbles (painterly depth technique) -->
  <!-- Layer 1: Large holes -->
  <ellipse cx="268" cy="185" rx="28" ry="22" fill="#92400E" opacity="0.65" mix-blend-mode="multiply"/>
  <ellipse cx="335" cy="172" rx="22" ry="18" fill="#92400E" opacity="0.6"/>
  <ellipse cx="298" cy="240" rx="32" ry="25" fill="#B45309" opacity="0.55"/>
  <ellipse cx="360" cy="230" rx="25" ry="20" fill="#92400E" opacity="0.6"/>
  <ellipse cx="238" cy="235" rx="20" ry="16" fill="#B45309" opacity="0.5"/>
  <ellipse cx="312" cy="290" rx="26" ry="20" fill="#92400E" opacity="0.55"/>
  <ellipse cx="252" cy="292" rx="18" ry="14" fill="#78350F" opacity="0.5"/>
  <ellipse cx="370" cy="278" rx="22" ry="17" fill="#92400E" opacity="0.52"/>
  <!-- Layer 2: Medium holes -->
  <ellipse cx="305" cy="160" rx="16" ry="12" fill="#B45309" opacity="0.5"/>
  <ellipse cx="345" cy="205" rx="14" ry="11" fill="#92400E" opacity="0.48"/>
  <ellipse cx="265" cy="210" rx="12" ry="10" fill="#78350F" opacity="0.5"/>
  <ellipse cx="330" cy="255" rx="14" ry="10" fill="#92400E" opacity="0.48"/>
  <ellipse cx="278" cy="265" rx="11" ry="9" fill="#78350F" opacity="0.45"/>
  <ellipse cx="385" cy="195" rx="15" ry="11" fill="#B45309" opacity="0.45"/>
  <ellipse cx="220" cy="265" rx="12" ry="9" fill="#92400E" opacity="0.45"/>
  <!-- Layer 3: Small holes scattered -->
  <ellipse cx="282" cy="175" rx="8" ry="6" fill="#78350F" opacity="0.45"/>
  <ellipse cx="358" cy="188" rx="7" ry="5.5" fill="#92400E" opacity="0.42"/>
  <ellipse cx="317" cy="220" rx="8" ry="6" fill="#78350F" opacity="0.4"/>
  <ellipse cx="244" cy="250" rx="7" ry="5" fill="#B45309" opacity="0.4"/>
  <ellipse cx="376" cy="252" rx="8" ry="6" fill="#78350F" opacity="0.4"/>
  <ellipse cx="292" cy="310" rx="8" ry="6" fill="#92400E" opacity="0.42"/>
  <ellipse cx="340" cy="315" rx="7" ry="5" fill="#78350F" opacity="0.38"/>

  <!-- Warm highlight catches — inner crumb brightness -->
  <ellipse cx="272" cy="182" rx="10" ry="7" fill="#FEF3C7" opacity="0.18"/>
  <ellipse cx="338" cy="170" rx="8" ry="5.5" fill="#FEF3C7" opacity="0.15"/>
  <ellipse cx="300" cy="238" rx="12" ry="8" fill="#FEF3C7" opacity="0.15"/>

  <!-- Dramatic side light from left -->
  <rect width="600" height="450" fill="url(#dramatic-light)"/>

  <!-- Cut edge highlight (bright crust edge) -->
  <ellipse cx="300" cy="214" rx="176" ry="162" fill="none" stroke="#D97706" stroke-width="3" stroke-opacity="0.35"/>
  <ellipse cx="300" cy="210" rx="155" ry="142" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Bottom cut flat edge line -->
  <rect x="112" y="378" width="376" height="12" rx="3" fill="#92400E" filter="url(#crust-tex)" opacity="0.9"/>
  <rect x="114" y="374" width="372" height="8" rx="2" fill="#D97706" opacity="0.5"/>

  <!-- Flour dusting on cut surface -->
  <g class="breathe">
    <circle cx="265" cy="168" r="4" fill="#FEF3C7" opacity="0.5"/>
    <circle cx="318" cy="160" r="3" fill="#FEF3C7" opacity="0.45"/>
    <circle cx="356" cy="178" r="3.5" fill="#FEF3C7" opacity="0.4"/>
    <circle cx="230" cy="245" r="3" fill="#FEF3C7" opacity="0.38"/>
  </g>
</svg>
