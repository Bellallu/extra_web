<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" width="300" height="60">
  <!-- Section icons for Crust & Crumb website -->
  <!-- Uses palette: #78350F #92400E #B45309 #D97706 #FDE68A -->

  <!-- Icon 1: Natural Fermentation (spiral/bubble) — x=0 -->
  <g id="icon-fermentation" transform="translate(0,0)">
    <circle cx="30" cy="30" r="24" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <!-- Spiral -->
    <path d="M 30 30 Q 38 22 38 30 Q 38 42 26 42 Q 14 42 14 28 Q 14 14 30 14 Q 44 14 44 30"
          stroke="#92400E" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- Bubbles -->
    <circle cx="24" cy="22" r="3" fill="#D97706" opacity="0.7"/>
    <circle cx="36" cy="26" r="2" fill="#B45309" opacity="0.65"/>
    <circle cx="28" cy="18" r="1.8" fill="#FDE68A" opacity="0.8"/>
  </g>

  <!-- Icon 2: Quality Flour (grain/sack) — x=80 -->
  <g id="icon-flour" transform="translate(80,0)">
    <circle cx="30" cy="30" r="24" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <!-- Grain sack shape -->
    <path d="M 20 42 Q 18 32 20 22 Q 25 16 30 16 Q 35 16 40 22 Q 42 32 40 42 Q 35 46 30 46 Q 25 46 20 42 Z"
          fill="#D97706" opacity="0.85"/>
    <!-- Tie knot at top -->
    <path d="M 25 18 Q 30 14 35 18" stroke="#92400E" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Grain dots -->
    <circle cx="26" cy="28" r="2.2" fill="#FDE68A"/>
    <circle cx="32" cy="26" r="2" fill="#FEF3C7" opacity="0.9"/>
    <circle cx="30" cy="34" r="2.2" fill="#FDE68A"/>
    <circle cx="36" cy="32" r="1.8" fill="#FEF3C7" opacity="0.85"/>
    <circle cx="24" cy="36" r="2" fill="#FDE68A"/>
  </g>

  <!-- Icon 3: No Shortcuts (clock with checkmark) — x=160 -->
  <g id="icon-time" transform="translate(160,0)">
    <circle cx="30" cy="30" r="24" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <!-- Clock face -->
    <circle cx="30" cy="30" r="16" fill="none" stroke="#92400E" stroke-width="2"/>
    <!-- Clock hands -->
    <line x1="30" y1="30" x2="30" y2="18" stroke="#78350F" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="30" y1="30" x2="40" y2="34" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
    <!-- Tick marks -->
    <line x1="30" y1="15" x2="30" y2="18" stroke="#D97706" stroke-width="1.5"/>
    <line x1="30" y1="42" x2="30" y2="45" stroke="#D97706" stroke-width="1.5"/>
    <line x1="15" y1="30" x2="18" y2="30" stroke="#D97706" stroke-width="1.5"/>
    <line x1="42" y1="30" x2="45" y2="30" stroke="#D97706" stroke-width="1.5"/>
    <!-- Center dot -->
    <circle cx="30" cy="30" r="2.5" fill="#92400E"/>
  </g>

  <!-- Icon 4: Pre-order/Saturday (calendar) — x=240 (but let's use 3 icons only for features) -->
  <!-- Actually including a 4th for menu/contact -->
  <g id="icon-calendar" transform="translate(240,0)">
    <circle cx="30" cy="30" r="24" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <!-- Calendar body -->
    <rect x="18" y="20" width="24" height="22" rx="3" fill="#D97706" opacity="0.9"/>
    <rect x="18" y="20" width="24" height="8" rx="3" fill="#92400E"/>
    <!-- Calendar date strokes -->
    <line x1="22" y1="34" x2="25" y2="34" stroke="#FFFDF7" stroke-width="1.8"/>
    <line x1="28" y1="34" x2="31" y2="34" stroke="#FFFDF7" stroke-width="1.8"/>
    <line x1="34" y1="34" x2="37" y2="34" stroke="#FFFDF7" stroke-width="1.8"/>
    <line x1="22" y1="39" x2="25" y2="39" stroke="#FFFDF7" stroke-width="1.8"/>
    <line x1="28" y1="39" x2="31" y2="39" stroke="#FDE68A" stroke-width="2" opacity="0.9"/>
    <!-- Binding rings top -->
    <line x1="24" y1="17" x2="24" y2="23" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="17" x2="36" y2="23" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
